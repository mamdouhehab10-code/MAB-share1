name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker (ensures docker is available)
        run: |
          sudo apt-get update || true
          sudo apt-get install -y docker.io || true

      - name: Build APK with Buildozer (inside kivy/buildozer Docker image)
        env:
          P4A_BRANCH: release-2023.06.14
        run: |
          docker run --rm -e P4A_BRANCH="$P4A_BRANCH" -v "${{ github.workspace }}":/home/user/hostcwd -w /home/user/hostcwd kivy/buildozer buildozer -v android debug

      - name: List generated files (debug)
        run: ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAB-share-apk
          path: |
            bin/*.apk
            bin/*.aab
